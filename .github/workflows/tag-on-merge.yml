name: New Tag on Merges

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  create-tag:
    # Runs only if the PR was actually MERGED, not merely closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract tag from PR description
        id: extract_tag
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 2. Remove carriage returns (\r) to prevent them from being appended to the variables
          CLEAN_BODY=$(echo "$PR_BODY" | tr -d '\r')
          
          # Look for a line such as "Tag: v1.0.0" in the PR description
          TAG=$(echo "$CLEAN_BODY" | grep -iE 'tag:\s*v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | awk -F':' '{print $2}' | tr -d ' ')
          TAG_DESCRIPTION=$(echo "$CLEAN_BODY" | grep -iE '^description:\s*.+$' | head -n1 | sed -E 's/^[Dd]escription:\s*//')
          
          if [ -z "$TAG" ]; then
            echo "No tag pattern found in the PR description. Skipping."
            echo "created=false" >> $GITHUB_OUTPUT
          elif [ -z "$TAG_DESCRIPTION" ]; then
            echo "No tag description found in the PR description. Skipping."
            echo "created=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=$TAG" >> $GITHUB_ENV
            {
              echo 'TAG_DESCRIPTION<<EOF'
              echo "$TAG_DESCRIPTION"
              echo EOF
            } >> "$GITHUB_ENV"
            echo "created=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and Push Tag
        if: steps.extract_tag.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "$TAG_DESCRIPTION"
          git push origin "$TAG_NAME"