name: New Tag on Merges

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  create-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.extract_tag.outputs.created }}
      tag_name: ${{ steps.extract_tag.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract tag from PR description
        id: extract_tag
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          CLEAN_BODY=$(echo "$PR_BODY" | tr -d '\r')
          
          TAG=$(echo "$CLEAN_BODY" | grep -iE 'tag:\s*v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | awk -F':' '{print $2}' | tr -d ' ')
          TAG_DESCRIPTION=$(echo "$CLEAN_BODY" | grep -iE '^description:\s*.+$' | head -n1 | sed -E 's/^[Dd]escription:\s*//')
          
          # Ensure the 'v' prefix is present
          if [ -n "$TAG" ] && [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi

          if [ -z "$TAG" ] || [ -z "$TAG_DESCRIPTION" ]; then
            echo "created=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=$TAG" >> $GITHUB_ENV
            {
              echo 'TAG_DESCRIPTION<<EOF'
              echo "$TAG_DESCRIPTION"
              echo EOF
            } >> "$GITHUB_ENV"
            
            # Save the outputs for the next job
            echo "created=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create and Push Tag
        if: steps.extract_tag.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "$TAG_DESCRIPTION"
          git push origin "$TAG_NAME"

  build-docker:
    permissions: {}
    needs: create-tag
    if: needs.create-tag.outputs.created == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      tag_name: ${{ needs.create-tag.outputs.tag_name }}