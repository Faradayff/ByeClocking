version: "3.8"

services:
  byeclocking:
    build: .
    container_name: byeclocking
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    # Inject the .env file so that LOG_LEVEL, the BYECLOCKING_* credentials and
    # the (optional) WEBHOOK_* variables actually reach the container.
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./cache:/app/cache

